name: Geometry Promotion Gate

on:
  pull_request:
    paths:
      - "config/cartography/promotion_*.json"
      - "tools/promote_geometry_artifact.py"
      - "tests/test_geometry_promotion.py"
      - ".github/workflows/geometry-promotion-ci.yml"
  workflow_dispatch:

concurrency:
  group: geometry-promotion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  exact-artifact-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Read immutable promotion registry
        id: registry
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          path = Path("config/cartography/promotion_cliopatria_10km_7644ea.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          print(f"run_id={data['artifact']['workflow_run_id']}")
          print(f"artifact_name={data['artifact']['artifact_name']}")
          PY

      - name: Download exact reviewed geometry artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.registry.outputs.artifact_name }}
          path: /tmp/geometry-promotion-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.registry.outputs.run_id }}

      - name: Validate exact artifact against acceptance registry
        shell: bash
        run: |
          python3 tools/promote_geometry_artifact.py \
            config/cartography/promotion_cliopatria_10km_7644ea.json \
            /tmp/geometry-promotion-artifact
