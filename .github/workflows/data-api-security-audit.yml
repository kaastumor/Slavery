name: Data API Security Audit

on:
  pull_request:
    paths:
      - "tools/audit_data_api_surface.py"
      - ".github/workflows/data-api-security-audit.yml"
      - "BACKLOG.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-readonly-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_REF: dilnayfllygkplsdymel
      SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Require scoped management credential
        shell: bash
        run: test -n "$SUPABASE_MANAGEMENT_TOKEN"

      - name: Verify PostgREST exposure and anonymous direct access
        shell: bash
        run: |
          python3 tools/audit_data_api_surface.py             --project-ref "$PROJECT_REF"             --output /tmp/data-api-security-audit.json

      - name: Upload redacted audit result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-api-security-audit-${{ github.sha }}
          path: /tmp/data-api-security-audit.json
          if-no-files-found: warn
          retention-days: 90
