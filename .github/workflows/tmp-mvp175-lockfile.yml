name: tmp-mvp175-lockfile
on:
  push:
    branches: [auto/175-frontend-build-lock]
permissions:
  contents: write
jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auto/175-frontend-build-lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
        continue-on-error: true
      - name: Generate lockfile and verify clean locked build
        working-directory: web
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run build
      - name: Remove bootstrap workflow and commit lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/package-lock.json
          git rm .github/workflows/tmp-mvp175-lockfile.yml
          git commit -m 'chore(web): lock reproducible npm dependency graph'
          git push origin HEAD:auto/175-frontend-build-lock
