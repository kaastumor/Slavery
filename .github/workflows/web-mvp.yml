name: Web MVP

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-mvp.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-mvp.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm run build
