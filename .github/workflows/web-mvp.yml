name: Web MVP

on:
  pull_request:
    paths:
      - "web/**"
      - "programmes/r1/**"
      - "experiments/exp04-blind-frontier/**"
      - "experiments/exp06-balanced-evidence/**"
      - "tools/build_exp04_research_preview.py"
      - "tools/build_exp06_candidate.py"
      - "tests/test_r1_mvp*.py"
      - ".github/workflows/web-mvp.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify committed candidate bundle is current
        run: python programmes/r1/build_mvp_candidate_bundle.py --check
      - name: Verify deterministic reconstruction
        run: |
          sha256sum web/public/data/r1-mvp-candidate.json > /tmp/candidate.sha256
          python programmes/r1/build_mvp_candidate_bundle.py
          sha256sum --check /tmp/candidate.sha256

      - name: Verify EXP-04 research preview bundle
        run: |
          python tools/build_exp04_research_preview.py --check
          sha256sum web/public/data/exp04-research-preview.json

      - name: Verify EXP-06 candidate package
        run: |
          python tools/build_exp06_candidate.py --check
          sha256sum web/public/data/exp06-candidate.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Runtime versions
        working-directory: web
        run: |
          node --version
          npm --version
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
