name: Bootstrap MVP candidate bundle
on:
  push:
    branches: [auto/176-static-candidate-bundle]
permissions:
  contents: write
jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auto/176-static-candidate-bundle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python programmes/r1/build_mvp_candidate_bundle.py
      - run: python programmes/r1/build_mvp_candidate_bundle.py --check
      - name: Commit generated artifact
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/public/data/r1-mvp-candidate.json
          git diff --cached --quiet && exit 0
          git commit -m 'mvp: materialize deterministic R1 candidate bundle'
          git push
