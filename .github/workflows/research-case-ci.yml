name: Research Case CI

on:
  pull_request:
    paths:
      - "data/research_case_template.json"
      - "data/research/cases/**"
      - "tools/add_research_case.py"
      - ".github/workflows/research-case-ci.yml"
  push:
    branches: [main]
    paths:
      - "data/research_case_template.json"
      - "data/research/cases/**"
      - "tools/add_research_case.py"
      - ".github/workflows/research-case-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate canonical research case template
        run: python tools/add_research_case.py data/research_case_template.json --require-case-key

      - name: Validate staged research cases
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t cases < <(find data/research/cases -maxdepth 1 -type f -name '*.json' | sort)

          echo "### Research case validation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${#cases[@]}" -eq 0 ]; then
            echo "No staged JSON research cases in this revision." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Validating ${#cases[@]} staged case(s)." | tee -a "$GITHUB_STEP_SUMMARY"
          for case_file in "${cases[@]}"; do
            echo "- `$case_file`" >> "$GITHUB_STEP_SUMMARY"
            python tools/add_research_case.py "$case_file" --require-case-key
          done

      - name: Assert CI is validation-only
        shell: bash
        run: |
          if grep -R --include='*.json' -n '"publication_status"[[:space:]]*:[[:space:]]*"published"' data/research/cases; then
            echo "Research staging must not contain publication_status=published." >&2
            exit 1
          fi
