name: M1 Cliopatria corpus probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  profile:
    if: github.head_ref == 'auto/104-cliopatria-baseline'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Profile exact pinned Cliopatria corpus
        run: |
          python tools/profile_cliopatria.py --output /tmp/cliopatria-profile.json
          echo '---BEGIN CLIOPATRIA PROFILE---'
          cat /tmp/cliopatria-profile.json
          echo '---END CLIOPATRIA PROFILE---'
