name: Production Geometry Promotion

on:
  # Production mutation remains explicit/manual while protected deployment
  # environments are unavailable (#43). The exact execution request must
  # already exist on main and still passes the immutable-artifact gates below.
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: production-geometry-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
      API_URL: https://dilnayfllygkplsdymel.supabase.co/functions/v1/atlas-data

    steps:
      - uses: actions/checkout@v4

      - name: Read one-time execution request
        id: request
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          request_path = Path("config/cartography/promotion_execution_cliopatria_10km_7644ea.json")
          request = json.loads(request_path.read_text(encoding="utf-8"))
          if request.get("schema_version") != "geometry-promotion-execution-v1":
              raise SystemExit("unsupported execution request schema")
          if request.get("apply") is not True:
              raise SystemExit("execution request is not marked apply=true")

          plan_path = Path(request["promotion_plan"])
          plan = json.loads(plan_path.read_text(encoding="utf-8"))
          if plan["promotion_id"] != request["promotion_id"]:
              raise SystemExit("execution request promotion_id does not match registry")

          print(f"project_ref={request['project_ref']}")
          print(f"plan_path={plan_path.as_posix()}")
          print(f"run_id={plan['artifact']['workflow_run_id']}")
          print(f"artifact_name={plan['artifact']['artifact_name']}")
          PY

      - name: Require scoped management credential
        shell: bash
        run: test -n "$SUPABASE_MANAGEMENT_TOKEN"

      - name: Download exact reviewed geometry artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.request.outputs.artifact_name }}
          path: /tmp/geometry-promotion-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.request.outputs.run_id }}

      - name: Revalidate immutable artifact and acceptance registry
        shell: bash
        run: |
          python3 tools/promote_geometry_artifact.py \
            "${{ steps.request.outputs.plan_path }}" \
            /tmp/geometry-promotion-artifact

      - name: Pre-change public availability gate
        shell: bash
        run: |
          python3 tools/probe_atlas_api.py \
            --url "$API_URL" \
            --timeout-seconds 12 \
            --slow-seconds 15

      - name: Verify Supabase project control-plane state
        shell: bash
        run: |
          set -euo pipefail
          body=$(curl -fsS --max-time 15 \
            -H "Authorization: Bearer $SUPABASE_MANAGEMENT_TOKEN" \
            "https://api.supabase.com/v1/projects/${{ steps.request.outputs.project_ref }}")
          status=$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("status", ""))' <<< "$body")
          test "$status" = "ACTIVE_HEALTHY" || {
            echo "BLOCK: Supabase project status is $status"
            exit 1
          }

      - name: Apply exact reviewed geometry artifact
        shell: bash
        run: |
          python3 tools/promote_geometry_management.py \
            "${{ steps.request.outputs.plan_path }}" \
            /tmp/geometry-promotion-artifact \
            --project-ref "${{ steps.request.outputs.project_ref }}" \
            --apply \
            --receipt /tmp/geometry-promotion-receipt.json

      - name: Post-change public availability gate
        shell: bash
        run: |
          python3 tools/probe_atlas_api.py \
            --url "$API_URL" \
            --timeout-seconds 12 \
            --slow-seconds 15

      - name: Upload immutable execution receipt
        uses: actions/upload-artifact@v4
        with:
          name: geometry-promotion-receipt-${{ github.sha }}
          path: /tmp/geometry-promotion-receipt.json
          if-no-files-found: error
          retention-days: 90
