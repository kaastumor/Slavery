name: EXP-06 Candidate Browser Review

on:
  pull_request:
    paths:
      - "web/exp06-candidate.html"
      - "web/src/exp06-candidate.ts"
      - "web/src/exp06-candidate.css"
      - "web/public/data/exp06-candidate.json"
      - "web/scripts/run_exp06_candidate_review.mjs"
      - ".github/workflows/exp06-candidate-browser.yml"

permissions:
  contents: read

concurrency:
  group: exp06-candidate-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install web and browser dependencies
        working-directory: web
        run: |
          npm install --package-lock-only
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local candidate server
        working-directory: web
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/exp06-vite.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/exp06-candidate.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/exp06-vite.log
          exit 1

      - name: Review exact candidate in browser
        working-directory: web
        run: |
          node scripts/run_exp06_candidate_review.mjs \
            http://127.0.0.1:4173/exp06-candidate.html \
            /tmp/exp06-candidate-review

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp06-candidate-browser-${{ github.sha }}
          path: /tmp/exp06-candidate-review/**
          if-no-files-found: error
          retention-days: 30

      - name: Vite log on failure
        if: failure()
        run: cat /tmp/exp06-vite.log || true
