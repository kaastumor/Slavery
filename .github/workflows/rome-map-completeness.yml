name: rome-map-completeness

on:
  pull_request:
    branches:
      - main
    paths:
      - tools/audit_rome_map_completeness.py
      - .github/workflows/rome-map-completeness.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Rome completeness audit
        run: python tools/audit_rome_map_completeness.py
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: rome-map-completeness
          path: |
            rome-map-completeness-report.json
            rome-cliopatria-ad14-candidate.geojson
          if-no-files-found: error
          retention-days: 7
