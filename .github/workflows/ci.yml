name: foundation-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_DB: slavery_atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ci_only_password
      POSTGRES_PORT: 54329
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Repository sanitation
        run: python tools/sanitize_repo.py

      - name: Build tooling and start PostGIS
        run: |
          docker compose --profile tools build tooling
          docker compose up -d db
          ./scripts/db-wait.sh

      - name: Migrations
        run: ./scripts/db-migrate.sh

      - name: Schema smoke test
        run: ./scripts/db-test-schema.sh

      - name: Claim-kind integrity
        run: docker compose exec -T db sh -lc 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f /workspace/db/tests/009_claim_kind_integrity.sql'

      - name: Python tests
        run: ./scripts/test-python.sh

      - name: Non-Atlantic rollback fixtures
        run: ./scripts/db-test-non-atlantic.sh

      - name: Research ingestion idempotency
        run: bash ./scripts/db-test-research-idempotency.sh

      - name: Private Data API boundary
        run: bash ./scripts/db-test-data-api-boundary.sh

      - name: Release channel pointer
        run: bash ./scripts/db-test-release-channel.sh

      - name: Reconstructible release membership
        run: bash ./scripts/db-test-release-membership.sh

      - name: Full-state release bundle
        run: bash ./scripts/db-test-release-bundle.sh

      - name: Prototype map sanity
        run: |
          python -m json.tool prototype/map/data/world-land.geojson >/dev/null
          python -m json.tool prototype/map/data/brazil-modern-proxy.geojson >/dev/null
          python -m json.tool prototype/map/data/slice.json >/dev/null
          node --input-type=module --check < prototype/map/app.js

      - name: Migration ledger status
        run: ./scripts/db-status.sh

      - name: Release manifest sanity
        run: |
          test -f data/releases/v0.6.1/SHA256SUMS.txt
          grep -q '^0a38e4eb6f63c3bb4ce9543be379605d24dd9ff1c1cea1e0a49c0c3db7ba17d4  Historical_Slavery_Atlas_v0.6.1_Controlled_Atlantic_Ingestion.xlsx$' data/releases/v0.6.1/SHA256SUMS.txt
          test ! -f data/releases/v0.6.1/Historical_Slavery_Atlas_v0.6.1_Controlled_Atlantic_Ingestion.xlsx

      - name: M2 post-M1 claim semantics prototype
        run: bash ./scripts/db-test-m2-claim-semantics.sh

      - name: M2 Cliopatria selected-year resolver
        run: bash ./scripts/db-test-cliopatria-resolver.sh

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color db

      - name: Tear down
        if: always()
        run: docker compose down -v
