name: foundation-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_DB: slavery_atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ci_only_password
      POSTGRES_PORT: 54329
      HSA_CANONICAL_WORKBOOK: data/releases/v0.6.1/Historical_Slavery_Atlas_v0.6.1_Controlled_Atlantic_Ingestion.xlsx
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build tooling and start PostGIS
        run: |
          docker compose --profile tools build tooling
          docker compose up -d db
          ./scripts/db-wait.sh

      - name: Migrations
        run: ./scripts/db-migrate.sh

      - name: Schema smoke test
        run: ./scripts/db-test-schema.sh

      - name: Python tests
        run: ./scripts/test-python.sh

      - name: Verify canonical release checksum
        run: ./scripts/verify-release.sh

      - name: Canonical workbook dry run
        run: ./scripts/dry-run-v061.sh

      - name: Import canonical workbook into CI database
        run: ./scripts/import-v061.sh

      - name: v0.6.1 reconciliation
        run: ./scripts/db-test-v061.sh

      - name: Non-Atlantic rollback fixtures
        run: ./scripts/db-test-non-atlantic.sh

      - name: Migration ledger status
        run: ./scripts/db-status.sh

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color db

      - name: Tear down
        if: always()
        run: docker compose down -v
