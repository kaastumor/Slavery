name: tooling-dvc-evaluation

on:
  pull_request:
    paths:
      - "experiments/dvc/**"
      - ".github/workflows/tooling-dvc-eval.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dvc-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned DVC for evaluation
        run: python -m pip install --disable-pip-version-check "dvc==3.66.0"

      - name: Exercise DVC add/push/pull roundtrip
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          remote="$(mktemp -d)"

          cd "$work"
          git init -q
          git config user.email "ci@example.invalid"
          git config user.name "Atlas CI"
          dvc init -q
          dvc remote add -d evaluation "$remote"

          python - <<'PY'
          from pathlib import Path
          import hashlib
          block = hashlib.sha256(b"Historical Slavery Atlas DVC evaluation").digest()
          Path("artifact.bin").write_bytes(block * 131072)
          PY

          original="$(sha256sum artifact.bin | awk '{print $1}')"
          original_size="$(stat -c%s artifact.bin)"

          dvc add artifact.bin
          git add .dvc .dvcignore artifact.bin.dvc .gitignore
          git commit -qm "track synthetic evaluation artifact"
          dvc push -q

          rm -f artifact.bin
          rm -rf .dvc/cache

          test ! -f artifact.bin
          dvc pull -q

          restored="$(sha256sum artifact.bin | awk '{print $1}')"
          restored_size="$(stat -c%s artifact.bin)"

          test "$restored" = "$original"
          test "$restored_size" = "$original_size"

          echo "DVC roundtrip SHA-256: $restored"
          echo "DVC roundtrip bytes: $restored_size"
          echo "Pointer metadata:"
          cat artifact.bin.dvc
          echo "Remote object count: $(find "$remote" -type f | wc -l)"
