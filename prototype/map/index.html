<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Historical Slavery Atlas — first map slice</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.10.0/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Historical Slavery Atlas</p>
        <h1>First vertical slice</h1>
      </div>
      <div class="year-control">
        <label for="year">Year <strong id="year-value">2000</strong></label>
        <input id="year" type="range" min="1850" max="2026" value="2000" step="1" />
      </div>
    </header>

    <section class="map-layout">
      <div id="map" aria-label="Interactive world map"></div>
      <aside id="panel" class="panel" aria-live="polite">
        <p class="panel-kicker">Prototype</p>
        <h2>Click Brazil</h2>
        <p>
          Neutral world land remains visible. The highlighted geometry is a modern proxy,
          not an assertion that the same boundary applies across the whole claim period.
        </p>
      </aside>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
